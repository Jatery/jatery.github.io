remote_theme: "mmistakes/minimal-mistakes@4.28.1"

plugins:
  - jekyll-feed
  - jekyll-include-cache

minimal_mistakes_skin: "default"

locale: "en-US"
title: "Jatery Chen"
masthead_title: "JATERY"
description: "The personal site of Jatery Chen, with software and music."
url: "https://jatery.github.io"
baseurl: ""
domain: "jatery.github.io"
repository: "Jatery/jatery.github.io"
github_username: "Jatery"

author:
  name: "Jatery Chen"
  avatar: "/assets/images/about.jpg"
  bio: "I build software and write music."
  location: "Taiwan"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:cyz3827@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Jatery"

atom_feed:
  hide: true

include:
  - "_pages"

exclude:
  - ".hallmark"
  - "_posts"
  - "assets/images/Ryoku.png"
  - "design.md"

defaults:
  - scope:
      path: "assets/images"
    values:
      image: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      show_date: true

timezone: "Asia/Taipei"
