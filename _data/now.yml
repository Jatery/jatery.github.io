- title: "Radios"
  text: "I’m tracing the path from an antenna through a circuit to the sound that comes out."

- title: "Photo grading"
  text: "I’m using RapidRAW to compare different colour grades on the same photograph."

- title: "Mechanical keyboards"
  text: "I’m new to mechanical keyboards and comparing switches, layouts and materials."

- title: "Music"
  text: "I have more musical ideas than finished pieces. I conduct a recorder ensemble and have plenty left to learn."

- title: "Side quests"
  text: "I saw a hydrangea origami tessellation in a reel, found some scrap advertising paper and spent the afternoon folding it."
