<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav id="site-nav" class="jatery-masthead" aria-label="Primary navigation">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.masthead_title | default: site.title }}</a>
      <ul class="jatery-masthead__links">
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</div>
