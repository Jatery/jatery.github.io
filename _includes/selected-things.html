<section class="home-section home-selected" id="selected" aria-labelledby="selected-title">
  <header class="home-selected__head">
    <h2 id="selected-title">Selected things</h2>
    <p>{{ page.selected_intro }}</p>
  </header>

  <ol class="thing-list">
    {% for thing in site.data.selected %}
      <li class="thing thing--{{ thing.slug }}{% if thing.image %} thing--has-media{% endif %}">
        <div class="thing__title">
          <h3>{{ thing.title }}</h3>
          <p class="thing__meta">{{ thing.meta }}</p>
        </div>

        {% if thing.image %}
          <figure class="thing__media">
            <img
              src="{{ thing.image | relative_url }}"
              alt="{{ thing.image_alt }}"
              width="{{ thing.image_width }}"
              height="{{ thing.image_height }}"
              loading="lazy"
              decoding="async"
            >
          </figure>
        {% endif %}

        <div class="thing__body">
          <p class="thing__description">{{ thing.description }}</p>
          {% if thing.url %}
            <a class="thing__link" href="{{ thing.url }}" rel="external">{{ thing.link_label }}</a>
          {% endif %}
        </div>
      </li>
    {% endfor %}
  </ol>
</section>
